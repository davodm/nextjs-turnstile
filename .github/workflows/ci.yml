name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify entry directives
        run: |
          for f in dist/index.js dist/index.mjs; do head -c 20 "$f" | grep -q '"use client"' || { echo "$f missing use client"; exit 1; }; done
          for f in dist/server.js dist/server.mjs; do ! grep -q 'use client' "$f" || { echo "$f must not be a client module"; exit 1; }; done
          ! grep -q 'next/headers' dist/index.js dist/index.mjs || { echo "client entry leaks next/headers"; exit 1; }
